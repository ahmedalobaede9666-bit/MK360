# MK360 0.1 experimental - copy to Hdd:\MK360\MK360.ini
# F6: toggle mapping | F7/F8: sensitivity -/+50 | F9: reload this file
[default]
enabled=1
# Keep enabled for the first hardware test; see README_AR.md.
require_xbdm=1
sensitivity=650
ads_percent=60
deadzone_x=7500
deadzone_y=7500
smoothing=25
invert_y=0

bind_W=MOVE_UP
bind_S=MOVE_DOWN
bind_A=MOVE_LEFT
bind_D=MOVE_RIGHT
bind_SPACE=A
bind_C=B
bind_LCTRL=B
bind_R=X
bind_F=X
bind_1=Y
bind_LSHIFT=LS
bind_V=RS
bind_Q=LB
bind_E=RB
bind_ENTER=START
bind_ESC=START
bind_TAB=BACK
bind_UP=UP
bind_DOWN=DOWN
bind_LEFT=LEFT
bind_RIGHT=RIGHT
mouse1=RT
mouse2=LT
mouse3=RS

# Per-game overrides use the title_id displayed in MK360.log:
# [1234ABCD]
# sensitivity=800
# ads_percent=55
