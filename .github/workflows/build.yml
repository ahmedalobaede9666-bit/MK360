name: Build MK360 XEX
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mk360-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev libmpfr-dev libmpc-dev flex bison texinfo
      - name: Cache open source cross compiler
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/mk360-xsdk
          key: xsdk-c-gcc15.3-binutils2.47-${{ runner.os }}-${{ hashFiles('tools/toolchain/*') }}
          restore-keys: xsdk-c-gcc15.3-binutils2.47-${{ runner.os }}-
      - name: Build compiler if not cached
        run: |
          if [ ! -x "$HOME/.local/mk360-xsdk/bin/powerpc-xsdk-elf-gcc" ]; then
            bash tools/toolchain/build.sh
          fi
      - name: Test and build MK360
        run: |
          export PATH="$HOME/.local/mk360-xsdk/bin:$PATH"
          if [ -f Makefile ]; then
            make package
          fi
      - name: Upload XEX package
        if: hashFiles('dist/*.zip') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MK360-experimental-XEX
          path: dist/*
          if-no-files-found: error
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-failure-logs
          path: ~/.cache/mk360-toolchain/logs/

